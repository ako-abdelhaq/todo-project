apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-config
    app.kubernetes.io/part-of: argocd
data:
  # Poll Git every 15 seconds (with up to 5s jitter) instead of the 3-minute default
  timeout.reconciliation: "15s"
  timeout.reconciliation.jitter: "5s"
  
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-project-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ako-abdelhaq/todo-project.git
    targetRevision: main
    path: manifest/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m