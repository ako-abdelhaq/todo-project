name: Release Todo App - staging

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'manifest/**'
      - 'argo/**'
      - 'monitoring/**'
      - '.gitignore'
      - '**.sh'

concurrency:
  group: gitops-ako-abdelhaq-todo-project
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-update-manifest-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed microservice directories
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            todo_app:
              - 'todo-app/**'
            todo_backend:
              - 'todo-backend/**'
            broadcaster:
              - 'broadcaster/**'
            todo_cronjob:
              - 'todo-cronjob/**'
      - name: Set up Docker Buildx
        if: |
          steps.changes.outputs.todo_app == 'true' ||
          steps.changes.outputs.todo_backend == 'true' ||
          steps.changes.outputs.broadcaster == 'true' ||
          steps.changes.outputs.todo_cronjob == 'true'
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        if: |
          steps.changes.outputs.todo_app == 'true' ||
          steps.changes.outputs.todo_backend == 'true' ||
          steps.changes.outputs.broadcaster == 'true' ||
          steps.changes.outputs.todo_cronjob == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push todo-app
        if: steps.changes.outputs.todo_app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:${{ github.sha }}

      - name: Build and push todo-backend
        if: steps.changes.outputs.todo_backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./to-do-backend
          file: ./to-do-backend/Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}

      - name: Build and push broadcaster
        if: steps.changes.outputs.broadcaster == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./broadcaster
          file: ./broadcaster/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/broadcaster:${{ github.sha }}

      - name: Build and push todo-cronjob
        if: steps.changes.outputs.todo_cronjob == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./todo-cronjob
          file: ./todo-cronjob/Dockerfile.todo-job
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-cronjob:${{ github.sha }}

      - name: Update image tags directly in YAML manifest
        run: |
          if [ "${{ steps.changes.outputs.todo_app }}" = "true" ]; then
            sed -i -E "s|image: (.*/)?todo-app:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:${{ github.sha }}|g" manifest/deployment.yml
          fi

          if [ "${{ steps.changes.outputs.todo_backend }}" = "true" ]; then
            sed -i -E "s|image: (.*/)?todo-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}|g" manifest/deployment.yml
          fi

          if [ "${{ steps.changes.outputs.broadcaster }}" = "true" ]; then
            sed -i -E "s|image: (.*/)?broadcaster:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/broadcaster:${{ github.sha }}|g" manifest/broadcaster-deployment.yml
          fi

          if [ "${{ steps.changes.outputs.todo_cronjob }}" = "true" ]; then
            sed -i -E "s|image: (.*/)?todo-cronjob:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-cronjob:${{ github.sha }}|g" manifest/cronjob.yml
          fi

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest/staging/*.yml
          git diff --staged --quiet || (
            git commit -m "Staging: update images for ${{ github.sha }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          )