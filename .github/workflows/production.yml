
name: Release Todo App - production

run-name: Deploy release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

concurrency:
  # Use the same group in staging and production to serialize config pushes.
  group: gitops-ako-abdelhaq-todo-project-config
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-update-manifest-production:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout application code at the release tag
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Detect changed microservices since the previous release
      - name: Detect changes since previous production tag
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          CURRENT_TAG="${GITHUB_REF_NAME}"

          # Find the next older version tag in descending version order.
          TAGS="$(git tag --list 'v*' --sort=-version:refname --merged "$CURRENT_TAG")"

          PREV_TAG="$(printf '%s\n' "$TAGS" | awk -v current="$CURRENT_TAG" '
            $0 == current { found=1; next }
            found { print; exit }
          ')"

          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found. Building all services."
            echo "todo_app=true" >> "$GITHUB_OUTPUT"
            echo "todo_backend=true" >> "$GITHUB_OUTPUT"
            echo "broadcaster=true" >> "$GITHUB_OUTPUT"
            echo "todo_cronjob=true" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing ${PREV_TAG}..${CURRENT_TAG}"

            CHANGED_FILES="$(git diff --name-only "$PREV_TAG" "$CURRENT_TAG")"
            echo "$CHANGED_FILES"

            if grep -q '^todo-app/' <<< "$CHANGED_FILES"; then
              echo "todo_app=true" >> "$GITHUB_OUTPUT"
            else
              echo "todo_app=false" >> "$GITHUB_OUTPUT"
            fi

            if grep -q '^to-do-backend/' <<< "$CHANGED_FILES"; then
              echo "todo_backend=true" >> "$GITHUB_OUTPUT"
            else
              echo "todo_backend=false" >> "$GITHUB_OUTPUT"
            fi

            if grep -q '^broadcaster/' <<< "$CHANGED_FILES"; then
              echo "broadcaster=true" >> "$GITHUB_OUTPUT"
            else
              echo "broadcaster=false" >> "$GITHUB_OUTPUT"
            fi

            if grep -q '^todo-cronjob/' <<< "$CHANGED_FILES"; then
              echo "todo_cronjob=true" >> "$GITHUB_OUTPUT"
            else
              echo "todo_cronjob=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # 3. Set up Docker Buildx if a service changed
      - name: Set up Docker Buildx
        if: |
          steps.changes.outputs.todo_app == 'true' ||
          steps.changes.outputs.todo_backend == 'true' ||
          steps.changes.outputs.broadcaster == 'true' ||
          steps.changes.outputs.todo_cronjob == 'true'
        uses: docker/setup-buildx-action@v3

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        if: |
          steps.changes.outputs.todo_app == 'true' ||
          steps.changes.outputs.todo_backend == 'true' ||
          steps.changes.outputs.broadcaster == 'true' ||
          steps.changes.outputs.todo_cronjob == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build and push changed services
      - name: Build and push todo-app
        if: steps.changes.outputs.todo_app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./todo-app
          file: ./todo-app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:${{ github.sha }}

      - name: Build and push todo-backend
        if: steps.changes.outputs.todo_backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./todo-backend
          file: ./todo-backend/Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}

      - name: Build and push broadcaster
        if: steps.changes.outputs.broadcaster == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./broadcaster
          file: ./broadcaster/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/broadcaster:${{ github.sha }}

      - name: Build and push todo-cronjob
        if: steps.changes.outputs.todo_cronjob == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./todo-cronjob
          file: ./todo-cronjob/Dockerfile.todo-job
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-cronjob:${{ github.sha }}

      # 6. Checkout the separate configuration repository
      - name: Checkout configuration repository
        if: |
          steps.changes.outputs.todo_app == 'true' ||
          steps.changes.outputs.todo_backend == 'true' ||
          steps.changes.outputs.broadcaster == 'true' ||
          steps.changes.outputs.todo_cronjob == 'true'
        uses: actions/checkout@v4
        with:
          repository: ako-abdelhaq/todo-project-config
          ref: main
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config
          fetch-depth: 0

      # 7. Update production manifests in the configuration repository
      - name: Update production image tags
        if: |
          steps.changes.outputs.todo_app == 'true' ||
          steps.changes.outputs.todo_backend == 'true' ||
          steps.changes.outputs.broadcaster == 'true' ||
          steps.changes.outputs.todo_cronjob == 'true'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          APP_CHANGED: ${{ steps.changes.outputs.todo_app }}
          BACKEND_CHANGED: ${{ steps.changes.outputs.todo_backend }}
          BROADCASTER_CHANGED: ${{ steps.changes.outputs.broadcaster }}
          CRONJOB_CHANGED: ${{ steps.changes.outputs.todo_cronjob }}
        run: |
          set -euo pipefail

          if [ "$APP_CHANGED" = "true" ]; then
            sed -i -E \
              "s|image: (.*/)?todo-app:.*|image: ${DOCKERHUB_USERNAME}/todo-app:${IMAGE_TAG}|g" \
              config/manifest/production/deployment.yml
          fi

          if [ "$BACKEND_CHANGED" = "true" ]; then
            sed -i -E \
              "s|image: (.*/)?todo-backend:.*|image: ${DOCKERHUB_USERNAME}/todo-backend:${IMAGE_TAG}|g" \
              config/manifest/production/deployment.yml
          fi

          if [ "$BROADCASTER_CHANGED" = "true" ]; then
            sed -i -E \
              "s|image: (.*/)?broadcaster:.*|image: ${DOCKERHUB_USERNAME}/broadcaster:${IMAGE_TAG}|g" \
              config/manifest/production/broadcaster-deployment.yml
          fi

          if [ "$CRONJOB_CHANGED" = "true" ]; then
            sed -i -E \
              "s|image: (.*/)?todo-cronjob:.*|image: ${DOCKERHUB_USERNAME}/todo-cronjob:${IMAGE_TAG}|g" \
              config/manifest/production/cronjob.yml
          fi

      # 8. Commit and push only to the configuration repository
      - name: Commit and push production manifests
        if: |
          steps.changes.outputs.todo_app == 'true' ||
          steps.changes.outputs.todo_backend == 'true' ||
          steps.changes.outputs.broadcaster == 'true' ||
          steps.changes.outputs.todo_cronjob == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git -C config config user.name "github-actions[bot]"
          git -C config config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git -C config add -- manifest/production/

          if git -C config diff --cached --quiet; then
            echo "No production manifest changes to commit."
            exit 0
          fi

          git -C config commit \
            -m "Production: release ${RELEASE_TAG}"

          git -C config pull --rebase origin main
          git -C config push origin HEAD:main
