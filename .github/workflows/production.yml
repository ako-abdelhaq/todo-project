name: Release Todo App - production

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - 'manifest/**'
      - 'argo/**'
      - 'monitoring/**'
      - '.gitignore'
      - '**.sh'

concurrency:
  group: gitops-ako-abdelhaq-todo-project
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-update-manifest-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes since previous production tag
        id: changes
        run: |
          git fetch --tags --force
          CURRENT_TAG="${GITHUB_REF_NAME}"
          # Find the previous v* tag before the current one
          PREV_TAG=$(git tag -l "v*" --sort=-version:refname | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)

          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag found. Building all services for initial release ${CURRENT_TAG}."
            echo "todo_app=true" >> $GITHUB_OUTPUT
            echo "todo_backend=true" >> $GITHUB_OUTPUT
            echo "broadcaster=true" >> $GITHUB_OUTPUT
            echo "todo_cronjob=true" >> $GITHUB_OUTPUT
          else
            echo "Comparing ${PREV_TAG}..${CURRENT_TAG}"
            CHANGED_FILES=$(git diff --name-only "${PREV_TAG}" "${CURRENT_TAG}")
            echo "Changed files since ${PREV_TAG}:"
            echo "${CHANGED_FILES}"

            if echo "$CHANGED_FILES" | grep -q "^todo-app/"; then
              echo "todo_app=true" >> $GITHUB_OUTPUT
            else
              echo "todo_app=false" >> $GITHUB_OUTPUT
            fi

            if echo "$CHANGED_FILES" | grep -q "^todo-backend/"; then
              echo "todo_backend=true" >> $GITHUB_OUTPUT
            else
              echo "todo_backend=false" >> $GITHUB_OUTPUT
            fi

            if echo "$CHANGED_FILES" | grep -q "^broadcaster/"; then
              echo "broadcaster=true" >> $GITHUB_OUTPUT
            else
              echo "broadcaster=false" >> $GITHUB_OUTPUT
            fi

            if echo "$CHANGED_FILES" | grep -q "^todo-cronjob/"; then
              echo "todo_cronjob=true" >> $GITHUB_OUTPUT
            else
              echo "todo_cronjob=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Set up Docker Buildx
        if: |
          steps.changes.outputs.todo_app == 'true' ||
          steps.changes.outputs.todo_backend == 'true' ||
          steps.changes.outputs.broadcaster == 'true' ||
          steps.changes.outputs.todo_cronjob == 'true'
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        if: |
          steps.changes.outputs.todo_app == 'true' ||
          steps.changes.outputs.todo_backend == 'true' ||
          steps.changes.outputs.broadcaster == 'true' ||
          steps.changes.outputs.todo_cronjob == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push todo-app
        if: steps.changes.outputs.todo_app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./todo-app
          file: ./todo-app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:${{ github.sha }}

      - name: Build and push todo-backend
        if: steps.changes.outputs.todo_backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./to-do-backend
          file: ./to-do-backend/Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}

      - name: Build and push broadcaster
        if: steps.changes.outputs.broadcaster == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./broadcaster
          file: ./broadcaster/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/broadcaster:${{ github.sha }}

      - name: Build and push todo-cronjob
        if: steps.changes.outputs.todo_cronjob == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./todo-cronjob
          file: ./todo-cronjob/Dockerfile.todo-job
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-cronjob:${{ github.sha }}

      - name: Update image tags directly in YAML manifest
        run: |
          if [ "${{ steps.changes.outputs.todo_app }}" = "true" ]; then
            sed -i -E "s|image: (.*/)?todo-app:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:${{ github.sha }}|g" manifest/production/deployment.yml
          fi

          if [ "${{ steps.changes.outputs.todo_backend }}" = "true" ]; then
            sed -i -E "s|image: (.*/)?todo-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}|g" manifest/production/deployment.yml
          fi

          if [ "${{ steps.changes.outputs.broadcaster }}" = "true" ]; then
            sed -i -E "s|image: (.*/)?broadcaster:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/broadcaster:${{ github.sha }}|g" manifest/production/broadcaster-deployment.yml
          fi

          if [ "${{ steps.changes.outputs.todo_cronjob }}" = "true" ]; then
            sed -i -E "s|image: (.*/)?todo-cronjob:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/todo-cronjob:${{ github.sha }}|g" manifest/production/cronjob.yml
          fi

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add manifest/production/*.yaml
          git diff --staged --quiet || (
            git commit -m "Production: release ${{ github.ref_name }}"
            git push origin main
          )