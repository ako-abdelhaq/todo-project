apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: project 
  name: todo-generator
spec:
  schedule: "0 * * * *" # Runs every hour at minute 0
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: todo-cronjob
              image: ako99/todo-cronjob:cca9e5aa8ecc8c947c6da9269651984fd71b5886
              imagePullPolicy: Always
              env:
                - name: BACKEND_URL
                  value: "http://ako-project-svc:2090/todos"