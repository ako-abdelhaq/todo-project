apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: production
  name: ako-project-dep
  annotations:
    kubernetes.io/change-cause: "Project v8"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ako-project
  template:
    metadata:
      labels:
        app: ako-project
    spec:
      volumes:
        - name: image-cache-volume
          persistentVolumeClaim:
            claimName: prod-image-cache-pvc
      containers:
        - name: ako-project
          image: ako99/todo-app:c8311602dc93d996870e64a87d1f511316edeaea
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TODOS_API_URL
              value: "http://localhost:8090"
            - name: CACHE_DIR
              value: "/usr/src/app/backend/files"
            - name: IMAGE_URL
              value: "https://picsum.photos/1200"
          volumeMounts:
            - name: image-cache-volume
              mountPath: /usr/src/app/backend/files
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10 # Wait 10s after container start before first check
            periodSeconds: 5        # Check every 5 seconds
            timeoutSeconds: 2       # Fail the check if todos backend doesn't respond within 2s
            failureThreshold: 3     # Remove pod from Service endpoints after 3 failures
            successThreshold: 1     # Mark Ready as soon as 1 check returns HTTP 200
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
        - name: todo-backend
          image: ako99/todo-backend:5ec216ce81d6a16a60832f630aedfd36006f15a7
          imagePullPolicy: Always            
          envFrom:
          - secretRef:
              name: ako-postgres-secret
          env:
            - name: PORT
              value: "8090"
            - name: DB_HOST
              value: "ako-postgres-svc"
            - name: DB_PORT
              value: "5432"
            - name: NATS_URL
              value: "nats://my-nats:4222"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 10 # Wait 10s after container start before first check
            periodSeconds: 5        # Check every 5 seconds
            timeoutSeconds: 2       # Fail the check if DB doesn't respond within 2s
            failureThreshold: 3     # Remove pod from Service endpoints after 3 failures
            successThreshold: 1     # Mark Ready as soon as 1 check returns HTTP 200
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
