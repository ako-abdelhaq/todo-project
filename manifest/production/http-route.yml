apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: combined-app-route
  namespace: production
spec:
  parentRefs:
    - name: ako-todo-gateway
      namespace: default
  hostnames:
    - "localhost"
  rules:
    # Rule 1:
    - matches:
        - path:
            type: PathPrefix
            value: /todos
      backendRefs:
        - name: ako-project-svc
          port: 2090

    # Rule 2: 
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ako-project-svc
          port: 2080