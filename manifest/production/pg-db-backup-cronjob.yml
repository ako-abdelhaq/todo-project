apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Runs once on deploy so a Pod immediately consumes and binds postgres-backup-pvc
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-backup-init
  namespace: production
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-backup-volume
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /backups
              echo "Backup volume initialized at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /backups/.initialized
          volumeMounts:
            - name: backup-storage
              mountPath: /backups
      volumes:
        - name: backup-storage
          persistentVolumeClaim:
            claimName: postgres-backup-pvc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: production
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: postgres:16-alpine
              envFrom:
                - secretRef:
                    name: postgres-secret
              command:
                - /bin/sh
                - -c
                - |
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/todo_db_${TIMESTAMP}.sql.gz"
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Creating production DB backup: ${BACKUP_FILE}"
                  PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump -h postgres-svc -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" | gzip > "${BACKUP_FILE}"
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Backup complete."
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup-pvc