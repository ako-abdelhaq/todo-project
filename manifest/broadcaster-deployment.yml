apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: broadcaster-dep
spec:
  replicas: 6
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: ako99/broadcaster:9e6782b17bb4e6ec52b77e0b62f53711b6ac5542
          imagePullPolicy: Always
          env:
            - name: NATS_URL
              value: "nats://my-nats:4222"
            - name: QUEUE_GROUP
              value: "todo-broadcaster-workers"
          envFrom:
            - secretRef:
                name: broadcaster-secret